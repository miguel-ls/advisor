<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADVISOR-ERP System</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- App Styles -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="theme-rojo-granate">

    <!-- ------------------------------------------------------------------- -->
    <!-- SCREEN 1: LOGIN & 2FA STEP -->
    <!-- ------------------------------------------------------------------- -->
    <div id="login-screen" class="app-screen auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2><i class="fas fa-shield-alt"></i> <span class="lbl-system-title">ADVISOR-ERP</span></h2>
                <p>Sistema de Gestión Empresarial Integrado</p>
            </div>

            <!-- Login Step 1: Username & Password -->
            <form id="login-step-1" onsubmit="handleLogin(event)">
                <div id="login-alert" class="alert alert-danger hidden"></div>
                <div class="form-group">
                    <label for="login-username"><i class="fas fa-user"></i> Usuario</label>
                    <input type="text" id="login-username" class="form-control" placeholder="Ingrese su usuario" value="admin" required>
                </div>
                <div class="form-group">
                    <label for="login-password"><i class="fas fa-key"></i> Contraseña</label>
                    <input type="password" id="login-password" class="form-control" placeholder="Ingrese su contraseña" value="admin123" required>
                </div>
                <button type="submit" class="btn"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</button>
            </form>

            <!-- Login Step 2: 2FA Verification -->
            <form id="login-step-2" class="hidden" onsubmit="handleVerify2FA(event)">
                <div id="2fa-alert" class="alert alert-danger hidden"></div>
                <div class="alert alert-info">
                    <i class="fas fa-info-circle"></i> Autenticación de 2 Factores requerida. Código por defecto: <strong>123456</strong>
                </div>
                <div class="form-group">
                    <label for="2fa-code"><i class="fas fa-shield-virus"></i> Código de Verificación 2FA</label>
                    <input type="text" id="2fa-code" class="form-control" placeholder="6 dígitos (ej. 123456)" value="123456" maxlength="6" required>
                </div>
                <button type="submit" class="btn"><i class="fas fa-check-circle"></i> Verificar y Entrar</button>
            </form>
        </div>
    </div>

    <!-- ------------------------------------------------------------------- -->
    <!-- SCREEN 2: EMPRESA Y AÑO EN CURSO SELECTION -->
    <!-- ------------------------------------------------------------------- -->
    <div id="company-select-screen" class="app-screen auth-container hidden">
        <div class="auth-card" style="max-width: 480px;">
            <div class="auth-header">
                <h2><i class="fas fa-building"></i> Contexto Empresarial</h2>
                <p>Seleccione la Empresa y Año Fiscal de trabajo</p>
            </div>
            <form onsubmit="confirmCompanyContext(event)">
                <div class="context-select-box">
                    <div class="form-group">
                        <label for="select-empresa"><i class="fas fa-city"></i> Empresa Asociada</label>
                        <select id="select-empresa" class="form-control" onchange="onEmpresaChange()" required>
                            <option value="">-- Seleccione Empresa --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="select-anio"><i class="fas fa-calendar"></i> Año Fiscal en Curso</label>
                        <select id="select-anio" class="form-control" disabled required>
                            <option value="">-- Seleccione Año --</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn"><i class="fas fa-arrow-right"></i> Ingresar al Sistema ADVISOR</button>
            </form>
        </div>
    </div>

    <!-- ------------------------------------------------------------------- -->
    <!-- SCREEN 3: MAIN SYSTEM DASHBOARD LAYOUT & DYNAMIC SIDEBAR TREE -->
    <!-- ------------------------------------------------------------------- -->
    <div id="main-app-screen" class="app-screen app-wrapper hidden">
        <!-- Dynamic Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-chart-line fa-lg" style="color: var(--accent);"></i>
                <span class="brand-title lbl-system-title">ADVISOR-ERP</span>
            </div>

            <div class="sidebar-context">
                <small style="color: rgba(255,255,255,0.6);">EMPRESA Y AÑO ACTIVO:</small>
                <span id="lbl-empresa-context">Cargando...</span>
            </div>

            <!-- Navigation Tree Container -->
            <nav class="sidebar-menu" id="sidebar-tree-container">
                <!-- Loaded dynamically from sp_usuario_permisos -->
            </nav>

            <!-- Bottom User Badge & Logout -->
            <div class="sidebar-footer">
                <div class="user-badge">
                    <div class="user-avatar" id="lbl-user-avatar">A</div>
                    <div class="user-info">
                        <span class="user-name" id="lbl-user-name">Usuario</span>
                        <span class="user-role" id="lbl-user-role">admin</span>
                    </div>
                </div>
                <button class="btn-logout" onclick="logout()" title="Cerrar Sesión">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Navbar -->
            <header class="top-navbar">
                <div class="navbar-page-title" id="lbl-navbar-page-title">
                    Mantenimiento del Sistema
                </div>
                <div class="navbar-actions">
                    <button class="btn btn-sm btn-secondary" onclick="loadCompaniesScreen()" style="width: auto;">
                        <i class="fas fa-exchange-alt"></i> Cambiar Empresa / Año
                    </button>
                </div>
            </header>

            <!-- Main Content Container -->
            <div class="content-body" id="main-content-body">
                <!-- Dynamic Content Loaded Here -->
            </div>
        </main>
    </div>

    <!-- App Scripts -->
    <script src="assets/js/app.js"></script>
</body>
</html>
